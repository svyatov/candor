version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      bundler:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Every `uses:` line is pinned to a commit SHA, which freezes it until something unfreezes
  # it. This entry is that something: it rewrites both the SHA and the version comment when a
  # new release ships. Without it, pinning ruby/setup-ruby would eventually cost a supported
  # Ruby.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
