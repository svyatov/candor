name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby_version }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby_version: [ruby-head, "4.0", "3.4", "3.3", "3.2"]

    env:
      COVERAGE: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A committed Gemfile.lock makes `bundler-cache: true` install in deployment mode, so this
      # resolves exactly what the lockfile records or fails.
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: true
        continue-on-error: ${{ matrix.ruby_version == 'ruby-head' }}

      - run: bundle exec rake
        continue-on-error: ${{ matrix.ruby_version == 'ruby-head' }}

      - name: Documentation coverage
        run: bundle exec rake yard:stats
        if: ${{ matrix.ruby_version == '4.0' }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: svyatov/candor
        if: ${{ matrix.ruby_version == '4.0' }}
