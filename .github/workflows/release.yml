name: Release

# Publishing is tag-triggered and runs nowhere else. RubyGems mints a token for this workflow file
# and this environment only, through OIDC, so no API key exists in this repository to steal.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# No Bundler cache anywhere in this workflow, including the test job. A restored cache is a
# cache-poisoning vector in a workflow that can authenticate to rubygems.org, and a release is rare
# enough that the lost cache costs nothing.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0"
          bundler-cache: false

      - run: bundle install
      - run: bundle exec rake

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0"
          bundler-cache: false

      - name: Check the tag matches Candor::VERSION
        run: |
          ruby -e '
            spec = Gem::Specification.load("candor.gemspec")
            tag = ENV.fetch("GITHUB_REF_NAME").delete_prefix("v")
            abort "tag #{tag} does not match gemspec version #{spec.version}" unless tag == spec.version.to_s
          '

      - name: Build the gem
        run: |
          mkdir -p pkg
          gem build candor.gemspec --output "pkg/candor-${GITHUB_REF_NAME#v}.gem"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-gem
          path: pkg/*.gem
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, build]
    # The environment is what makes the gate load-bearing. RubyGems is configured to mint a token
    # only for a run of this workflow in this environment, so an unapproved run gets no credential.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-gem
          path: pkg/

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0"
          bundler-cache: false

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      # Sign explicitly rather than relying on client-version-dependent implicit behaviour.
      - name: Sign the gem with sigstore
        run: |
          gem exec --conservative sigstore-cli:0.2.3 sign \
            "pkg/candor-${GITHUB_REF_NAME#v}.gem" \
            --bundle "pkg/candor-${GITHUB_REF_NAME#v}.gem.sigstore.json"

      - name: Push to rubygems.org
        run: |
          gem push "pkg/candor-${GITHUB_REF_NAME#v}.gem" \
            --attestation "pkg/candor-${GITHUB_REF_NAME#v}.gem.sigstore.json"

  # A separate job on purpose. The build job must not hold release-asset writes or an attestation
  # identity, and `needs: [publish]` is what keeps the attached assets behind the approval gate.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [publish]
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: built-gem
          path: pkg/

      - name: Take the release body from CHANGELOG.md
        run: |
          ruby -e '
            version = ENV.fetch("GITHUB_REF_NAME").delete_prefix("v")
            section = File.read("CHANGELOG.md")[/^## \[#{Regexp.escape(version)}\][^\n]*\n(.*?)(?=^## |\z)/m, 1]
            abort "CHANGELOG.md has no section for #{version}" if section.nil? || section.strip.empty?
            File.write("RELEASE_NOTES.md", "#{section.strip}\n")
          '

      # sha256sum runs from inside pkg/ so the names it records are the names the assets carry on
      # the release. A manifest listing pkg/candor-x.y.z.gem cannot be checked against a download.
      - name: Write the checksum manifest
        run: (cd pkg && sha256sum *) > SHA256SUMS

      # subject-checksums makes every file listed a subject in its own right, by name and digest.
      # Attesting SHA256SUMS itself would let a consumer verify the manifest and nothing it lists.
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: SHA256SUMS

      - name: Publish the release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
          gh release upload "$GITHUB_REF_NAME" pkg/* SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
